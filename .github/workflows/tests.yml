name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # The forecasting core is standard library only, so the test job installs
    # nothing but pytest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest==8.3.5
      - run: pytest -q

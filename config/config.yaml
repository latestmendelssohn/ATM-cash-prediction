# ===========================================================================
# Central configuration for the ATM cash-forecasting pipeline.
# Values here are read by src/atmforecast/config.py (Pydantic settings).
# ===========================================================================

data:
  raw_path: data/raw/atm_transactions.csv
  processed_path: data/processed/atm_daily.csv
  # column names in the raw transaction file
  date_col: date
  atm_col: atm_id
  target_col: net_cash_out        # daily net cash dispensed (INR)
  balance_col: end_of_day_balance # cash remaining in the machine (INR)

forecast:
  horizon: 14                     # forecast H days ahead
  frequency: D                    # daily series
  seasonal_period: 7              # weekly seasonality
  test_size: 28                   # hold-out window (days) for final evaluation
  min_train_size: 120             # minimum history before first backtest origin

# Rolling-origin (walk-forward) backtest
backtest:
  step: 7                         # advance the origin by 7 days each fold
  refit: true                     # refit model at every origin

models:
  enabled:
    - seasonal_naive
    - moving_average
    - holt_winters
    - sarima
  holt_winters:
    trend: add
    seasonal: add
    seasonal_periods: 7
  sarima:
    # (p,d,q)(P,D,Q)m  -- start values; auto_arima can refine these
    order: [1, 1, 1]
    seasonal_order: [1, 1, 1, 7]

# Cash-management / operations layer
operations:
  # target service level: probability the ATM does NOT run out of cash
  service_level: 0.95
  # cost of replenishment visit vs. cost of a cash-out (stock-out) event
  replenish_cost: 500            # INR per visit
  stockout_penalty: 5000         # INR per stock-out day (reputational + SLA)
  # cash-carrying (opportunity) cost per INR per day
  holding_rate_annual: 0.06

rag:
  model: gemini-1.5-flash
  embedding_model: models/text-embedding-004
  chroma_dir: ./chroma_db
  collection: atm_forecast_reports
  top_k: 4
  temperature: 0.1

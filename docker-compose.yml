# ---------------------------------------------------------------------------
# docker compose up  ->  starts the forecasting + RAG analyst API on :8000
# ---------------------------------------------------------------------------
services:
  api:
    build: .
    image: atm-cash-forecasting:latest
    ports:
      - "8000:8000"
    environment:
      # Provide your Gemini key via a local .env file (see .env.example).
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-models/text-embedding-004}
      CHROMA_DIR: /app/chroma_db
    env_file:
      - .env
    volumes:
      # Persist the vector store and any locally-mounted data across restarts.
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

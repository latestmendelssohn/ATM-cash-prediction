[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atm-cash-forecasting"
version = "0.1.0"
description = "Time-series forecasting of daily cash demand / end-of-day cash balance at ATMs, with a Gemini-powered RAG analyst layer."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "M.Sc. (Mathematics) Project, IIT Delhi" }]
license = { text = "MIT" }
keywords = ["time-series", "forecasting", "SARIMA", "holt-winters", "ATM", "cash-management", "RAG", "gemini"]

[project.scripts]
atmf = "atmforecast.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
